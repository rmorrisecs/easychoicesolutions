<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Us Page for Easy Choice Solutions LLC">
  <title>Contact Us - Easy Choice Solutions LLC</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header>
    <img src="/assets/images/ecs-logo-light.png" alt="Easy Choice Solutions Logo" class="logo">
    <h1>Contact Us</h1>
  </header>
  <main class="container">
    <form action="/forms/submit-form.php" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
    <p>Phone: (123) 456-7890</p>
    <p>Email: info@easychoicesolutions.com</p>
  </main>
